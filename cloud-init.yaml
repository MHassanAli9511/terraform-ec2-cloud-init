#cloud-config
package_reboot_if_required: true
package_update: true  
package_upgrade: true

packages:
 - nginx 


write_files:
- path: /var/www/html/index.html
  content: |
   Hello from Terraform & Cloud-init!
  permissions: '0644'
  defer: true

runcmd:
  - systemctl start nginx
  - systemctl enable nginx